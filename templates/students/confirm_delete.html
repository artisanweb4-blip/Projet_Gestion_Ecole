{% extends "base.html" %}
{% load static %}

{% block title %}Confirmer la suppression{% endblock %}

{% block content %}
<div class="dashboard-card text-center" style="max-width: 500px; margin: 50px auto;">
    <h3>Confirmer la suppression</h3>
    <p>Êtes-vous sûr de vouloir supprimer l'élève <strong>{{ object.first_name }} {{ object.last_name }}</strong> ?</p>
    <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'students:list' %}" class="btn btn-secondary">Annuler</a>
            <button type="submit" class="btn btn-danger">Supprimer</button>
        </div>
    </form>
</div>
{% endblock %}
